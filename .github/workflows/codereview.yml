# AI pull-request review.
#
# Copy to .github/workflows/codereview.yml.
#
# Repository variables:
#   CODEREVIEW_AGENT_REPO   owner/agent-repo   (required)
#   CODEREVIEW_AGENT_REF    full 40-character commit SHA (required; the job
#                           fails closed if it is unset or not a SHA)
#
# Repository secrets:
#   OPENAI_API_KEY, OPENAI_BASE_URL, OPENAI_MODEL
#   COHERE_API_KEY, COHERE_EMBED_MODEL        (optional, for context retrieval)
#
# Design notes:
# - Do not add `paths-ignore`. A required check that is skipped stays
#   "Expected" and blocks the PR forever. Docs-only detection runs inside the
#   job and only skips the LLM step.
# - Do not filter `draft == false` at the job level. That disables draft review
#   even if the agent supports it. `ready_for_review` is in the trigger list.
# - Fork PRs do not receive repository secrets. The fork guard fails on purpose.
#   If you need fork review, build a separate trusted workflow; do not switch to
#   pull_request_target and execute the fork's code.
# - The env names below are the reference agent's. Keep the structure and the
#   exit-code contract, replace names that do not match your reviewer.

name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# A newer push to the same PR cancels the stale review and its model call.
# The expression only works because this workflow has no push trigger.
concurrency:
  group: codereview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job name is the required status check. Do not rename it without
  # updating branch protection.
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # GitHub expressions in job env become the strings "true" / "false".
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Fork guard
        if: env.SAME_REPO != 'true'
        run: |
          echo "::error::Fork PRs do not receive repository secrets. Review manually or use a trusted workflow."
          exit 1

      - name: Require pinned agent ref
        if: env.SAME_REPO == 'true'
        env:
          AGENT_REPO: ${{ vars.CODEREVIEW_AGENT_REPO }}
          AGENT_REF: ${{ vars.CODEREVIEW_AGENT_REF }}
        run: |
          if [ -z "$AGENT_REPO" ]; then
            echo "::error::CODEREVIEW_AGENT_REPO must be set to owner/agent-repo"
            exit 1
          fi
          if ! printf '%s' "$AGENT_REF" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::CODEREVIEW_AGENT_REF must be a full 40-character commit SHA; got '$AGENT_REF'"
            exit 1
          fi

      - name: Checkout agent
        if: env.SAME_REPO == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODEREVIEW_AGENT_REPO }}
          ref: ${{ vars.CODEREVIEW_AGENT_REF }}
          path: .codereview

      - name: Set up Python
        if: env.SAME_REPO == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Remove the cache block if your agent has no requirements.txt.
          cache-dependency-path: .codereview/requirements.txt

      - name: Install agent
        if: env.SAME_REPO == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .codereview/requirements.txt
          python -m pip install -e .codereview

      - name: Detect docs-only pull request
        id: scope
        if: env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Fail open to a full review: never skip code because the API failed.
          docs_only=false
          if changed=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            if [ -n "$changed" ]; then
              docs_only=true
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                case "$file" in
                  *.md|*.mdx|*.rst|*.png|*.jpg|*.jpeg|*.gif|*.svg) ;;
                  *) docs_only=false; break ;;
                esac
              done <<< "$changed"
            fi
          else
            echo "gh api failed; running the full review instead of skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = "true" ]; then
            echo "Docs-only PR: skipping the LLM step; the required check still reports success." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore review state
        if: env.SAME_REPO == 'true' && steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@v4
        with:
          # Adjust these paths to your agent's state files.
          # Only the SQLite cache is shared across PRs. history.jsonl is not
          # persisted: it is fed into future prompts and is the easiest
          # cross-PR prompt-injection vector.
          path: |
            data/codereview.db*
          key: codereview-state-${{ github.repository }}-review-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            codereview-state-${{ github.repository }}-review-

      - name: Review PR
        if: env.SAME_REPO == 'true' && steps.scope.outputs.docs_only != 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          # Reasoning models spend tokens on reasoning_content. Too low a limit
          # produces an empty body with finish_reason=length.
          OPENAI_MAX_TOKENS: "16384"
          # Must be longer than the retry budget; a 64K retry can take minutes.
          OPENAI_TIMEOUT: "300"
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_EMBED_MODEL: ${{ secrets.COHERE_EMBED_MODEL }}
          LOG_LEVEL: "INFO"
          # security is the agent's production-tested mode; ensemble doubles
          # the cost and fails closed if either agent errors on a large diff.
          REVIEW_MODE: "security"
          REVIEW_DRY_RUN: "false"
          REVIEW_DRAFTS: "true"
          # No embedding provider configured for this deployment; the full
          # diff is small enough to review without retrieval.
          REVIEW_CONTEXT_ENABLED: "false"
          REVIEW_DEPENDENCY_ENABLED: "true"
          # History is prompt input from previous PRs; disable it so a
          # same-repo PR cannot poison later reviews through the shared cache.
          REVIEW_HISTORY_ENABLED: "false"
          REVIEW_POST_EMPTY_SUMMARY: "true"
          REVIEW_POST_ON_PARTIAL: "false"
          # Keep the whole repository baseline diff in one chunk.
          REVIEW_MAX_DIFF_CHARS: "100000"
          REVIEW_POLICY_ENABLED: "true"
          REVIEW_POLICY_PATH: ".codereview/policies/security.json"
          REVIEW_PROMPT_DIR: ".codereview/prompts"
          DATABASE_PATH: "data/codereview.db"
          CHROMA_PATH: "data/chroma"
          CACHE_DIR: "data/cache"
          REVIEW_AUDIT_PATH: "data/audit.jsonl"
        run: |
          mkdir -p data
          # Keep --post fail-loud: non-zero exit when no review was posted.
          python -I -X utf8 -m codereview.cli \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --post

      - name: Save review state
        # Save even when the review failed, so a rerun can reuse embeddings.
        # The main-scoped cache is only written by the state workflow, and only
        # when this workflow concludes success.
        if: always() && env.SAME_REPO == 'true' && steps.scope.outcome == 'success' && steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/codereview.db*
          key: codereview-state-${{ github.repository }}-review-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload review state
        if: always() && env.SAME_REPO == 'true' && steps.scope.outcome == 'success' && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codereview-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/codereview.db*
          if-no-files-found: ignore
          retention-days: 3
